<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches DEFAULT_THEME. Read before the bundle runs, so it cannot be left on the old palette:
         a warm app with this set dark flashes a black status bar and installs with a dark splash. -->
    <meta name="theme-color" content="#faf7f2" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- PNG fallback for surfaces that don't render SVG favicons (some share sheets, link
         unfurlers, older browsers) — without it those show no icon at all. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>owewell · split bills, keep friends</title>
    <meta
      name="description"
      content="Split a bill in seconds. Who owes who, sorted. No login required."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://owewell.aidenjang.com/" />
    <meta property="og:title" content="owewell" />
    <meta property="og:description" content="Split bills, keep friends. Mostly." />
    <meta property="og:image" content="https://owewell.aidenjang.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="owewell" />
    <meta name="twitter:description" content="Split bills, keep friends. Mostly." />
    <meta name="twitter:image" content="https://owewell.aidenjang.com/og.png" />
    <!-- Same-origin and preloaded: the stylesheet that declares this font is in the bundle, so the
         browser would otherwise only discover the file after parsing that CSS. latin-ext is not
         preloaded because most tabs never need a glyph from it. -->
    <link rel="preload" href="/fonts/inter-latin-v20.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
