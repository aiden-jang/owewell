# Fly.io config for the single-origin Owe Well app.
# Deploy: `fly launch --no-deploy` (first time), set secrets, then `fly deploy`.
app = "owe-well"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Scale to zero when idle (free-tier friendly). Trade-off: a cold start on the
  # first request after idle, and live WebSocket clients reconnect after wake.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
