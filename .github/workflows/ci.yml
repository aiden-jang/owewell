name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://owewell:owewell@localhost:5432/owewell?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: owewell
          POSTGRES_PASSWORD: owewell
          POSTGRES_DB: owewell
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owewell -d owewell"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @owe-well/server exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter @owe-well/server exec prisma migrate deploy

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
