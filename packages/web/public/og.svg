<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Social share card. Served directly as og:image; the rendering surface
       supplies the sans-serif fallback for the wordmark. Content is CENTERED so
       consumers that crop the 1.91:1 image toward a square (e.g. the iOS/Safari
       share-sheet thumbnail) still show the mark + wordmark instead of empty space. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0b0a12" />

  <!-- Just the mark + wordmark (no tagline): the tagline turns to illegible specks in a share-sheet
       thumbnail, so keep the card to the two things that read at any size. Centered so square crops
       stay on-brand. -->
  <g transform="translate(507, 165)">
    <rect width="186" height="186" rx="50" fill="url(#g)" />
    <g transform="translate(55, 37) scale(0.31)">
      <path d="M150 96 h212 v300 l-30 -20 -30 20 -30 -20 -30 20 -30 -20 -32 20 z" fill="#0a0a12" fill-opacity="0.92" />
      <g stroke="#a78bfa" stroke-width="26" stroke-linecap="round">
        <line x1="196" y1="178" x2="316" y2="178" />
        <line x1="196" y1="238" x2="316" y2="238" />
        <line x1="196" y1="298" x2="282" y2="298" />
      </g>
    </g>
  </g>

  <text x="600" y="500" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="150" font-weight="800" fill="#f4f4f5" letter-spacing="-5">owewell</text>
</svg>
