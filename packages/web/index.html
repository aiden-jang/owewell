<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Two, scoped by scheme, because the browser reads this long before any script runs.

      One hardcoded value could only ever be right for half the audience, and it was set to the warm
      background while the stylesheet's :root is the dark palette — so every visitor got a cream
      status bar over a near-black page until the bundle parsed. These match --page-bg in index.css.
      The script below narrows them further once a stored choice is known.
    -->
    <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151d1e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=20261010" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=20261010" />
    <!-- PNG fallback for surfaces that don't render SVG favicons (some share sheets, link
         unfurlers, older browsers) — without it those show no icon at all. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=20261010" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261010" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Sets the palette before the first paint.

      The stylesheet's :root is the dark palette, so without this a warm visitor sees a near-black
      page for as long as it takes the bundle to parse and call initTheme() — the exact flash this
      whole arrangement exists to avoid. Inline and synchronous on purpose: a deferred script or a
      module import both run after the first paint, which is too late to matter.

      Deliberately a duplicate of storedTheme() in src/lib/theme.ts, which cannot help here because
      it lives in the bundle. Same two rules: a stored choice wins, otherwise follow the device.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('owewell:theme');
          var name =
            stored === 'dark' || stored === 'warm'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'warm';
          document.documentElement.dataset.theme = name;
          if (stored) {
            var color = name === 'dark' ? '#151d1e' : '#f7f4ec';
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
              m.setAttribute('content', color);
              m.removeAttribute('media');
            });
          }
        } catch (e) {
          /* Private mode, or no matchMedia. The stylesheet's own default still applies. */
        }
      })();
    </script>
    <title>owewell · split bills, keep friends</title>
    <meta name="description" content="Split a bill in seconds. Who owes who, sorted. No login required." />
    <meta
      property="og:image:alt"
      content="An illustrated receipt above owewell: Split the bill. Keep the friends."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://owewell.aidenjang.com/" />
    <meta property="og:title" content="owewell" />
    <meta property="og:description" content="Split bills, keep friends. Mostly." />
    <meta property="og:image" content="https://owewell.aidenjang.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      name="twitter:image:alt"
      content="An illustrated receipt above owewell: Split the bill. Keep the friends."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="owewell" />
    <meta name="twitter:description" content="Split bills, keep friends. Mostly." />
    <meta name="twitter:image" content="https://owewell.aidenjang.com/og.png" />
    <!-- Same-origin and preloaded: the stylesheet that declares this font is in the bundle, so the
         browser would otherwise only discover the file after parsing that CSS. latin-ext is not
         preloaded because most tabs never need a glyph from it. -->
    <link rel="preload" href="/fonts/inter-latin-v20.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
