name = "owewell"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
# Served only on the custom domain (owewell.aidenjang.com), not a *.workers.dev route.
workers_dev = false

# Local dev port — matches the owewell-web Vite proxy target (packages/web/vite.config.ts).
[dev]
port = 34200

# Base URL of the shared auth service, used server-side to validate sessions. Local dev
# overrides this with `--var AUTH_URL:http://localhost:34100`.
[vars]
AUTH_URL = "https://accounts.aidenjang.com"

# App data lives here; identity accounts remain in the separate Accounts database.
[[d1_databases]]
binding = "DB"
database_name = "owewell"
database_id = "1f212b63-ba43-42a4-8b5c-38d7f5c76efb"
migrations_dir = "migrations"

# Per-group realtime fan-out. One GroupRoom instance per group, addressed by group id.
# Product events, written fire-and-forget from the route handlers. One dataset across every app,
# with the app name in index1 and blob1, so a single query can compare them.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "aidenjang_events"

[[durable_objects.bindings]]
name = "REALTIME"
class_name = "GroupRoom"

# GroupRoom uses the hibernation API and holds no persisted state, but the free plan requires
# all Durable Objects to be SQLite-backed, so it's registered as a new_sqlite_classes migration.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupRoom"]

# Serve the SPA and API on one origin; the Worker handles API routes before falling back to assets.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Limit requests before authentication to bound calls to the shared Accounts service.
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "2002"
simple = { limit = 240, period = 60 }

# Public share lookup has a tighter per-IP limit before D1 access.
[[ratelimits]]
name = "SHARE_LIMITER"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

# Custom domain; ignored by local Wrangler.
[[routes]]
pattern = "owewell.aidenjang.com"
custom_domain = true

# Worker logs are available through `wrangler tail` and the Cloudflare dashboard.
[observability]
enabled = true
head_sampling_rate = 1

# Anonymous analytics has its own rate bucket, separate from sign-in and room actions.
[[ratelimits]]
name = "EVENT_LIMITER"
namespace_id = "9001"
simple = { limit = 60, period = 60 }
