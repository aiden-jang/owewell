name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:core
      # Exercise the browser against the real Worker and migrated D1.
      - name: Install Playwright browser
        run: pnpm --filter @owewell/web exec playwright install --with-deps chromium webkit
      - run: pnpm run e2e
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failures
          path: packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: production-assets
          path: packages/web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Deploy after checks pass. The token needs Workers Scripts:Edit and D1:Edit for migrations.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-owewell
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: production-assets
          path: packages/web/dist/
      # Apply migrations before deploying code that depends on their schema.
      - name: Deploy to Cloudflare
        working-directory: packages/api
        run: pnpm run deploy:assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
