name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Use `pnpm run` so built-in pnpm commands cannot shadow repository scripts.
      - run: pnpm run gates
      - run: pnpm run size
      - run: pnpm run css-vars
      - run: pnpm run comments
      - run: pnpm run check:docs
      - run: pnpm run knip
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
      # Check emitted CSS after building; valid source classes can still produce no styles.
      - run: pnpm run dead-classes
      - run: pnpm run test
      # Exercise the browser against the real Worker and migrated D1.
      - name: Install Playwright browser
        run: pnpm --filter @owewell/web exec playwright install --with-deps chromium webkit
      - run: pnpm run e2e
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failures
          path: packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Deploy after checks pass. The token needs Workers Scripts:Edit and D1:Edit for migrations.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-owewell
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Apply migrations before deploying code that depends on their schema.
      - name: Deploy to Cloudflare
        run: pnpm run deploy
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
