name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm <name>` is not `pnpm run <name>`: where pnpm has a command of its own it wins and
      # the script is unreachable. `deploy` is one of those. This checks the whole chain.
      - run: pnpm run gates
      - run: pnpm run typecheck
      - run: pnpm run lint
      # The repo is prettier-formatted and the config describes it, so drift is a CI failure rather
      # than something the next person's editor silently fixes half of.
      - run: pnpm run format:check
      - run: pnpm run build
      # After the build, because it diffs the source's class names against the CSS Tailwind actually
      # emitted. A class that never gets generated produces no CSS and no error: typecheck, lint and
      # the whole suite stayed green while a bad @custom-variant deleted all 114 hover styles.
      - run: pnpm run dead-classes
      - run: pnpm run test

  # Auto-deploy to Cloudflare on merge to main, only after the checks above pass.
  # Requires a CLOUDFLARE_API_TOKEN repo secret with BOTH Workers Scripts:Edit and D1:Edit.
  # D1 is not optional: `pnpm run deploy` applies pending migrations before it ships the code, and a
  # Workers-only token fails that step with a 7403 and never reaches the deploy.
  # Wrangler infers the account from the token, so no account_id is needed here.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-owewell
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations first, then the code, in that order and failing hard if the migration fails.
      # Shipping code whose migration has not run is what 500'd /auth/me for every app once: the
      # column was missing in production and every session lookup threw. `pnpm run deploy` chains
      # `d1 migrations apply owewell --remote` ahead of `wrangler deploy` so the two cannot
      # drift apart. Applying by hand was the old contract and is what allowed that drift.
      - name: Deploy to Cloudflare
        run: pnpm run deploy
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
